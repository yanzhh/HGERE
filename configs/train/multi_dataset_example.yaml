# Multi-dataset training example: SciER + SciNLP with separate heads.
#
# In multi-dataset mode, set `multi_dataset` instead of `label_set` and
# `ner_prediction_dir`. Each dataset entry points to its own pruner output
# directory. The shared encoder (SciBERT) is updated by all batches; each
# dataset activates only its own NER and relation classification heads.
#
# Usage:
#   uv run train-hgere configs/train/multi_dataset_example.yaml

model_dir: saves/multi_head/scier_scinlp_run1
base_model_name_or_path: allenai/scibert_scivocab_uncased
model_type: hyper
do_lower_case: true
no_sym: true
max_seq_length: 512

# Model architecture (shared across datasets)
factor_type: ternary
factor_encoder: biaf
ent_dim: 400
rel_dim: 400
mem_dim: 400
ent_repr: mix
n_iter: 3
layernorm: true
layernorm_1st: true
attn_self: true

ner_focal_loss: false
re_focal_loss: false

# Multi-dataset configuration — replaces `label_set` and `ner_prediction_dir`
multi_dataset:
  sampling_temperature: 0.5  # p(d) ∝ n_d^T * weight; 1.0 = proportional to size
  datasets:
    - name: scier
      label_set: scier
      ner_prediction_dir: saves/scier/pruner/output
      train_file: ent_pred_train.json
      dev_file: ent_pred_dev.json
      test_file: ent_pred_test.json
      sampling_weight: 1.0
    - name: scinlp
      label_set: scinlp
      ner_prediction_dir: saves/scinlp/pruner/output
      train_file: ent_pred_train.json
      dev_file: ent_pred_dev.json
      test_file: ent_pred_test.json
      sampling_weight: 1.0

train_params:
  log_wandb: false
  project_name: multi-head-hgere
  run_name: scier_scinlp_run1
  save_results: true
  eval_train: false
  eval_dev: true
  eval_test: true
  seed: 42
  shuffle: false
  preload_dataset: false
  n_workers: 16
  do_train: true
  learning_rate: 2e-5
  learning_rate_cls: 2e-5
  num_train_epochs: 30
  eval_epochs: 1
  per_gpu_train_batch_size: 16
  gradient_accumulation_steps: 1
  adam_epsilon: 1e-8
  fp16: true
  local_rank: -1
  loss_re_weight_alpha: 0.5
  evaluate_during_training: true
  eval_all_checkpoints: true
  overwrite_output_dir: true
