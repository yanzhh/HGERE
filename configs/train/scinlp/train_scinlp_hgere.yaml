label_set: scinlp
model_dir: saves/scinlp/HGERE/reproduce_with_our_pruner_04_maxents4
base_model_name_or_path: allenai/scibert_scivocab_uncased
model_type: hyper
do_lower_case: true
no_sym: false
per_gpu_eval_batch_size: 8
max_ents: 4
max_seq_length: 256 # 512!
factor_type: tersibcop # tersibcop # ternary not run yet
factor_encoder: biaf
ent_dim: 400
rel_dim: 400
mem_dim: 400
ent_repr: mix
n_iter: 3
layernorm: true
layernorm_1st: true
attn_self: true
ner_focal_loss: false
re_focal_loss: false

# Data
## Pruner predictions used as NER candidates input to HGERE
ner_prediction_dir: saves/scinlp/pruner/friedrich_bs8_lr1e-6
#data_dir: datasets/gsap-ere

# Optimisation
train_params:
    # W&B
    log_wandb: true
    project_name: scinlp-hgere
    run_name: reproduce_with_our_pruner_04_maxents4
    train_file: ent_pred_trai.json
    dev_file: ent_pred_de.json
    test_file: ent_pred_tes.json
    save_results: true
    eval_train: true
    eval_test: true
    seed: 45
    pre_filter_params:
        method: threshold
        value: 0.04
    shuffle: false
    preload_dataset: false
    n_workers: 16
    do_train: true
    learning_rate: 1e-5
    learning_rate_cls: 1e-4
    num_train_epochs: 30
    eval_epochs: 1
    per_gpu_train_batch_size: 4
    gradient_accumulation_steps: 1
    adam_epsilon: 1e-8
    weight_decay: 0.1
    fp16: true
    local_rank: -1
    # Loss
    loss_re_weight_alpha: 0.5 # (1 - alpha) * loss_ner + alpha * loss_re
    # Evaluation
    evaluate_during_training: true
    eval_all_checkpoints: true
    overwrite_output_dir: true
