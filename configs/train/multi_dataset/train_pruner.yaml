# Train a single shared neural pruner on SciER + SciNLP + GSAP-ERE.
#
# The pruner is label-set-agnostic (binary span scorer), so one model covers
# all three datasets. The shared rulebased_pruner_file comes from
# fit_rulebased_pruner.yaml. After training, run pruner inference on each
# dataset separately to produce the ent_pred_*.json files referenced in
# train_hgere.yaml.
#
# Usage:
#   uv run gsapere-train-pruner configs/train/multi_dataset/train_pruner.yaml

label_set: scier
model_dir: saves/multi-sciere/pruner/sittich-shuffle-6ep
base_model_name_or_path: allenai/scibert_scivocab_uncased
do_lower_case: true
model_type: bertspanmarkerpruner
per_gpu_eval_batch_size: 32
max_seq_length: 256
max_pair_length: 64
max_mention_ori_length: 12

train_params:
    project_name: multi-sciere-pruner
    run_name: sittich-shuffle-6ep
    # All three datasets concatenated into a single training set.
    # Prepare this with: cat datasets/scier/train.jsonl datasets_fixed/scinlp/train.jsonl
    #                        datasets/gsap-ere/2025-05-15/train.jsonl > datasets/multi-sciere/train.jsonl
    data_dir: datasets/multi-sciere
    train_file: train.jsonl
    dev_file: dev.jsonl
    test_file: test.jsonl
    rulebased_pruner_file: saves/multi-sciere/pre-filter/rules.json
    seed: 44
    shuffle: true
    learning_rate: 1e-6
    num_train_epochs: 6
    eval_epochs: 1
    per_gpu_train_batch_size: 16
    gradient_accumulation_steps: 1
    save_steps: 1000
    fp16: true
    local_rank: -1
    pruner_loss: focal
    topk_ratio: 8
    min_mentions_num: 1
    max_mentions_num: 60
    onedropout: true
    lminit: true
    nocross: true
    biaf_span: true
    biaf_mode: 2
    biaf_factorize: true
    span_hidden_size: 768
    rank: 768
    span_size: 256
    evaluate_during_training: true
    eval_all_checkpoints: true
    overwrite_model_dir: true
