# Multi-head HGERE: SciER + SciNLP + GSAP-ERE with separate NER/RE heads.
#
# The shared SciBERT encoder is updated by all batches; each dataset activates
# only its own NER and relation classification heads. Each ner_prediction_dir
# must contain ent_pred_train.json / ent_pred_dev.json / ent_pred_test.json
# produced by running the shared pruner (train_pruner.yaml) on each dataset.
#
# Usage:
#   uv run train-hgere configs/train/multi_dataset/train_hgere.yaml

model_dir: saves/domain-shift-sciere/hgere/B_nlp_auxiliary
base_model_name_or_path: allenai/scibert_scivocab_uncased
model_type: hyper
do_lower_case: true
no_sym: true
max_seq_length: 512
seeds:
 - 41
 - 42
 - 43
 - 44
 - 45
factor_type: ternary
factor_encoder: biaf
ent_dim: 256
rel_dim: 256
head_hidden_dim: 256
mem_dim: 256
ent_repr: mix
n_iter: 3
layernorm: true
layernorm_1st: true
attn_self: true

ner_focal_loss: false
re_focal_loss: false
use_dataset_id_token_as_cls: false

sampling_temperature: 0.8
datasets:
  - label_set: scier
    ner_prediction_dir: saves/gsap-ere/pruner/best/domain-shift-scier
    train_file: ent_pred_train.json
    dev_file: ent_pred_dev.json
    test_file: ent_pred_test.json
    sampling_weight: 1.0
  - label_set: gsap
    ner_prediction_dir: saves/gsap-ere/pruner/best/domain-shift-gsap-ere-auxiliary
    train_file: ent_pred_train_nlp.json
    sampling_weight: 1.0

train_params:
    log_wandb: true
    num_train_epochs: 10
    pre_filter_params:
        method: threshold
        value: 0.0125
    project_name: multi-head-domain-shift
    wandb_entity: ottowg-gesis7279
    save_results: true
    eval_train: false
    eval_dev: true
    eval_test: true
    shuffle: false
    preload_dataset: false
    n_workers: 16
    do_train: true
    learning_rate: 1e-5
    learning_rate_cls: 1e-5
    eval_epochs: 1
    per_gpu_train_batch_size: 21
    gradient_accumulation_steps: 1
    adam_epsilon: 1e-8
    fp16: true
    local_rank: -1
    loss_re_weight_alpha: 0.5
    evaluate_during_training: true
    eval_all_checkpoints: true
    overwrite_output_dir: true
