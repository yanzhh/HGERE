label_set: scinlp

pruner:
    #model_dir: /data_ssds/disk01/ottowg_gsap/model-hgere/gsap-best-pruner
    model_dir: saves/scinlp/pruner/best
    base_model_name_or_path: allenai/scibert_scivocab_uncased
    do_lower_case: true
    model_type: bertspanmarkerpruner
    per_gpu_eval_batch_size: 32
    max_seq_length: 256
    max_pair_length: 64
    max_mention_ori_length: 12
    rulebased_pruner_file: saves/scinlp/pre-filter/rules.json
    topk_ratio: 8
    min_mentions_num: 1
    max_mentions_num: 60
    final_pruning:
        method: threshold
        threshold: 0.00005

hgere:
    #model_dir: saves/scinlp/HGERE/august_fuchs_lr5e-5_ep15
    model_dir: saves/scinlp/hgere/best
    seeds:
        - 42
        - 43
        - 44
        - 45
        - 46
    base_model_name_or_path: allenai/scibert_scivocab_uncased
    model_type: hyper
    do_lower_case: true
    shuffle: false
    no_sym: true
    per_gpu_eval_batch_size: 32
    max_seq_length: 512
    factor_type: tersibcop
    factor_encoder: biaf
    ent_dim: 400
    rel_dim: 400
    mem_dim: 400
    ent_repr: mix
    n_iter: 3
    layernorm: true
    layernorm_1st: true
    attn_self: true
    pre_filter_params:
        method: threshold
        value: 0.02
