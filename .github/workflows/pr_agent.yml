name: PR Agent
on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action
        uses: Codium-ai/pr-agent@main
        env:
          # 配置 DeepSeek API
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com/v1" # DeepSeek API 地址
          CONFIG.MODEL: "deepseek-chat" # 或者 deepseek-reasoner (R1)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
